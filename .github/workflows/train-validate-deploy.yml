name: Train, Validate, Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/churn/**"
      - "config/**"
      - "data/**/*.dvc"
      - "requirements.txt"
      - "terraform/**"
      - ".github/workflows/train-validate-deploy.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-1

jobs:
  train-validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Run early, not just before deploy: this is also how we learn the
      # DVC bucket's name (it's random-suffixed) without hardcoding it a
      # second place — Terraform state is the one source of truth for it.
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Look up data bucket name
        working-directory: terraform
        run: echo "DVC_BUCKET=$(terraform output -raw dvc_bucket_name)" >> "$GITHUB_ENV"

      - name: Pull versioned data
        run: dvc pull

      # MLflow's tracking DB is a local SQLite file — it doesn't survive
      # past this ephemeral runner on its own. Pull the shared one from S3
      # first (same bucket as the data, different prefix) so this run's
      # history extends the real one instead of starting from empty every
      # time. `|| true`: fine if this is the very first run and nothing
      # exists in S3 yet.
      - name: Pull shared MLflow tracking DB
        run: aws s3 cp "s3://${{ env.DVC_BUCKET }}/mlflow/mlflow.db" mlflow.db || true

      - name: Train candidates and register champion
        run: python -m churn.training.train

      # Push back regardless of what the gate below decides — a rejected
      # run's metrics are still worth keeping in history, not just the ones
      # that shipped.
      - name: Push shared MLflow tracking DB
        run: aws s3 cp mlflow.db "s3://${{ env.DVC_BUCKET }}/mlflow/mlflow.db"

      # If this fails, the job stops here — package/deploy steps below never
      # run. That's GitHub Actions' default behavior for a failed step, not
      # extra logic we had to write.
      - name: Quality gate
        run: python -m churn.training.gate

      - name: Package model for SageMaker
        run: python -m churn.inference.package

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
